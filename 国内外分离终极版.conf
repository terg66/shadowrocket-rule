# ── 12. Fail-to-Proxy 绝对防泄漏兜底 (全部带 no-resolve；按协议特征 + ASN 自治域彻底锁死国内 App 裸 IP 逃逸) ──
# 1) 无论阿里 AMDC 以后换成全网哪个新 IP，凡是明文裸 IP 调 /amdc/mobileDispatch 一律强制本地直连
URL-REGEX,^http://\d+\.\d+\.\d+\.\d+/amdc/mobileDispatch,DIRECT
# 2) 防以后改走 HTTPS 裸 IP：按大厂自治域号(ASN)接管；因带 no-resolve，所有走域名的正常海外网站完全不受影响，只有“硬编码纯裸 IP”才会命中
IP-ASN,24429,DIRECT,no-resolve
IP-ASN,45102,DIRECT,no-resolve
IP-ASN,132203,DIRECT,no-resolve
IP-CIDR,17.0.0.0/8,DIRECT,no-resolve
GEOIP,CN,DIRECT,no-resolve

# ── 13. 终极兜底 ──
FINAL,PROXY

[Host]
# 局域网主机名、反向 PTR 查询与 Wi-Fi 门户认证域名交还系统/路由器 DNS，解决公网 DoH 无法解析内网的问题
localhost = 127.0.0.1
*.local = server:system
*.lan = server:system
*.home.arpa = server:system
*.in-addr.arpa = server:system
*.ip6.arpa = server:system
captive.apple.com = server:system
