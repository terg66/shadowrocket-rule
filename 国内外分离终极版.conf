# ── 17. 地理位置兜底 (严防 DNS 泄漏核心) ──
# 【审计修正】：必须加回 no-resolve！如果移除，未收录的国外域名会强制使用国内 DNS 解析，导致严重泄漏。加上后，未收录域名直接进入 FINAL 走代理远端解析。
GEOIP,CN,DIRECT,no-resolve

# ── 18. 终极兜底 ──
FINAL,PROXY

[Host]
