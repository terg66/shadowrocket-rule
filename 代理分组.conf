🇭🇰 香港节点 = url-test, policy-regex-filter=(?i)(?=.*(港|\bhk\b|hong\s?kong))^((?!(美|\bus\b|日|\bjp\b|新|\bsg\b|瑞士|\bch\b|\brs\b)).)*$, url=http://captive.apple.com/hotspot-detect.html, interval=600, tolerance=50, timeout=5
🇺🇸 美国节点 = url-test, policy-regex-filter=(?i)(?=.*(美|\bus\b|洛杉矶|西雅图|states|american))^((?!(港|\bhk\b|日|\bjp\b|新|\bsg\b|瑞士|\bch\b|\brs\b)).)*$, url=http://captive.apple.com/hotspot-detect.html, interval=600, tolerance=50, timeout=5
🇯🇵 日本节点 = url-test, policy-regex-filter=(?i)(?=.*(日|\bjp\b|japan|tokyo))^((?!(港|\bhk\b|美|\bus\b|新|\bsg\b|瑞士|\bch\b|\brs\b)).)*$, url=http://captive.apple.com/hotspot-detect.html, interval=600, tolerance=50, timeout=5
🇸🇬 新加坡节点 = url-test, policy-regex-filter=(?i)(?=.*(新|\bsg\b|singapore|狮城))^((?!(港|\bhk\b|美|\bus\b|日|\bjp\b|瑞士|\bch\b|\brs\b)).)*$, url=http://captive.apple.com/hotspot-detect.html, interval=600, tolerance=50, timeout=5
🇨🇭 瑞士节点 = url-test, policy-regex-filter=(?i)(?=.*(瑞士|\bch\b|swiss|\brs\b|rs负载))^((?!(港|\bhk\b|美|\bus\b|日|\bjp\b|新|\bsg\b)).)*$, url=http://captive.apple.com/hotspot-detect.html, interval=600, tolerance=50, timeout=5

